[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "mojo-agent"
version = "0.1.0"
description = "Self-evolving algorithmic agent without LLM dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.3"]
[project.scripts]
mojo-agent = "mojo_agent.cli:main"
[tool.setuptools.packages.find]
include = ["mojo_agent*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
