name: CI
on:
  push:
    branches: [main, 'implementation/**']
  pull_request:
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build

  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell installer syntax
        run: bash -n scripts/*.sh
      - name: Validate installer inventory
        run: |
          test -s scripts/install_backend.sh
          test -s scripts/install_backend.ps1
          test -s scripts/install_frontend.sh
          test -s scripts/install_frontend.ps1
          test -s scripts/install_all.sh
          test -s scripts/install_all.ps1
          test -s scripts/install_termux.sh
          test -s scripts/run_termux_backend.sh
          test -s scripts/run_termux_frontend.sh
          test -s scripts/run_backend.sh
          test -s scripts/run_backend.ps1
          test -s scripts/run_frontend.sh
          test -s scripts/run_frontend.ps1
          test -s docs/INSTALLATION.md
